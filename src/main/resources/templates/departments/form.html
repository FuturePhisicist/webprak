<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Форма подразделения</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <div class="topbar">
        <h1 th:text="${title}"></h1>
        <nav class="nav">
            <a class="button" th:href="@{/}">На главную</a>
            <a class="button" th:href="@{/departments}">Отменить</a>
        </nav>
    </div>
    <div th:if="${error}" class="message error" th:text="${error}"></div>

    <form class="panel" th:action="${departmentId} == null ? @{/departments} : @{/departments/{id}(id=${departmentId})}" th:object="${form}" method="post">
        <div class="grid">
            <div class="field"><label for="name">Название</label><input id="name" th:field="*{name}" required></div>
            <div class="field">
                <label for="parentDepartmentId">Головное подразделение</label>
                <select id="parentDepartmentId" th:field="*{parentDepartmentId}">
                    <option value="">Корневое</option>
                    <option th:each="department : ${departments}" th:value="${department.id}" th:text="${department.name}"></option>
                </select>
            </div>
            <div class="field">
                <label for="managerEmployeeId">Руководитель</label>
                <select id="managerEmployeeId" th:field="*{managerEmployeeId}">
                    <option value="">Не назначен</option>
                    <option th:each="employee : ${employees}" th:value="${employee.id}" th:text="${employee.fullName}"></option>
                </select>
            </div>
        </div>
        <div class="actions">
            <button class="primary" type="submit">Сохранить</button>
            <a class="button" th:href="@{/departments}">Отменить</a>
        </div>
    </form>
</main>
</body>
</html>
