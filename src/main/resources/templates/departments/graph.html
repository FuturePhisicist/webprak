<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Граф подразделений</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <div class="topbar">
        <h1>Граф подразделений</h1>
        <nav class="nav">
            <a class="button" th:href="@{/}">На главную</a>
            <a class="button" th:href="@{/departments}">Назад к списку</a>
            <a class="button primary" th:href="@{/departments/new}">Добавить подразделение</a>
        </nav>
    </div>
    <section class="graph">
        <ul class="tree">
            <li th:each="node : ${nodes}" th:style="'margin-left: ' + ${node.depth * 36} + 'px'">
                <div class="node">
                    <a th:href="@{/departments/{id}(id=${node.id})}" th:text="${node.name}"></a>
                    <p class="muted">
                        Руководитель:
                        <a th:if="${node.managerId != null}" th:href="@{/employees/{id}(id=${node.managerId})}" th:text="${node.managerName}"></a>
                        <span th:if="${node.managerId == null}" th:text="${node.managerName}"></span>
                    </p>
                    <p class="muted" th:text="'Сотрудники: ' + ${node.activeEmployeeCount} + ', внутренние: ' + ${node.childCount}"></p>
                </div>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
