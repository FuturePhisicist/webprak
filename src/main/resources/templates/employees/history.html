<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>История служащего</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page">
    <div class="topbar">
        <h1>История: <span th:text="${employee.fullName}"></span></h1>
        <nav class="nav">
            <a class="button" th:href="@{/}">На главную</a>
            <a class="button" th:href="@{/employees/{id}(id=${employee.id})}">Карточка служащего</a>
        </nav>
    </div>
    <div th:if="${success}" class="message success" th:text="${success}"></div>

    <table>
        <thead><tr><th>Подразделение</th><th>Должность</th><th>Дата начала</th><th>Дата окончания</th><th>Примечание</th></tr></thead>
        <tbody>
        <tr th:each="assignment : ${assignments}">
            <td><a th:href="@{/departments/{id}(id=${assignment.department.id})}" th:text="${assignment.department.name}"></a></td>
            <td><a th:href="@{/positions/{id}(id=${assignment.position.id})}" th:text="${assignment.position.name}"></a></td>
            <td th:text="${assignment.startDate}"></td>
            <td th:text="${assignment.endDate == null ? 'Текущее' : assignment.endDate}"></td>
            <td th:text="${assignment.note}"></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
